<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treino Direto</title>
<meta name="theme-color" content="#12162B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app do personal com barra lateral no computador e abas embaixo no celular; app do aluno em coluna de celular, com a marca do personal */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#121628; --ink-2:#2B3045; --muted:#5D647A; --line:#E1E4EC; --line-2:#C9CEDA;
  --brand:#2B44D6; --brand-ink:#FFFFFF;
  --brand-text:var(--brand);
  --brand-soft:color-mix(in srgb,var(--brand) 11%,#FFFFFF);
  --ok:#16794A; --ok-ink:#FFFFFF; --ok-soft:#DFF3E8;
  --warn:#9A5800; --warn-soft:#FBEBD0;
  --bad:#B42F28; --bad-soft:#FADDDB;
  --rest-bg:#12162B; --rest-fg:#FFFFFF; --timer:#F2B705;
  --overlay:rgba(10,12,24,.48);
  --h1bg:#DCEBFF; --h1fg:#1F4FA8; --h2bg:#DDF3EA; --h2fg:#1A6B4C; --h3bg:#FCE7D6; --h3fg:#9A4513; --h4bg:#EEE3FB; --h4fg:#5B33A6;
  --shadow:0 1px 2px rgba(18,22,40,.05),0 10px 30px -14px rgba(18,22,40,.22);
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0F1C; --surface:#151A2C; --surface-2:#1B2136; --ink:#EDEFF7; --ink-2:#CDD1E0; --muted:#98A0B8; --line:#262C44; --line-2:#3A415E;
  --brand-text:color-mix(in srgb,var(--brand) 52%,#FFFFFF);
  --brand-soft:color-mix(in srgb,var(--brand) 24%,#151A2C);
  --ok:#4FC384; --ok-ink:#062312; --ok-soft:#14321F;
  --warn:#E8A646; --warn-soft:#3A2B10;
  --bad:#F2716A; --bad-soft:#3E1A19;
  --rest-bg:#22283F; --rest-fg:#FFFFFF;
  --overlay:rgba(0,0,0,.6);
  --h1bg:#1D2E52; --h1fg:#9DBEFF; --h2bg:#173A2E; --h2fg:#7FD9B0; --h3bg:#43281A; --h3fg:#F4B48A; --h4bg:#30244A; --h4fg:#C9B0F5;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F1C; --surface:#151A2C; --surface-2:#1B2136; --ink:#EDEFF7; --ink-2:#CDD1E0; --muted:#98A0B8; --line:#262C44; --line-2:#3A415E;
  --brand-text:color-mix(in srgb,var(--brand) 52%,#FFFFFF);
  --brand-soft:color-mix(in srgb,var(--brand) 24%,#151A2C);
  --ok:#4FC384; --ok-ink:#062312; --ok-soft:#14321F;
  --warn:#E8A646; --warn-soft:#3A2B10;
  --bad:#F2716A; --bad-soft:#3E1A19;
  --rest-bg:#22283F; --rest-fg:#FFFFFF;
  --overlay:rgba(0,0,0,.6);
  --h1bg:#1D2E52; --h1fg:#9DBEFF; --h2bg:#173A2E; --h2fg:#7FD9B0; --h3bg:#43281A; --h3fg:#F4B48A; --h4bg:#30244A; --h4fg:#C9B0F5;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-stretch:86%;margin:0;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
h1{font-size:1.85rem;font-weight:800;line-height:1.08}
h2{font-size:1.2rem;font-weight:750;line-height:1.2}
h3{font-size:1.02rem;font-weight:720;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--brand-text)}
:focus-visible{outline:2.5px solid var(--brand-text);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:.87rem}
.xs{font-size:.78rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-ok{color:var(--ok)} .t-bad{color:var(--bad)} .t-warn{color:var(--warn)}

/* barra de demonstração */
.demo{background:var(--rest-bg);color:var(--rest-fg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:7px}
.demo-tag{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;opacity:.82;min-width:0}
.demo-tag .ic{width:16px;height:16px}
.demo-tag .wide{display:none}
@media(min-width:560px){.demo-tag .wide{display:inline}}
.switch{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;gap:2px;flex:none}
.switch button{border:0;background:none;color:inherit;padding:5px 13px;border-radius:999px;font-size:.82rem;font-weight:700;opacity:.78}
.switch button[aria-pressed="true"]{background:#FFFFFF;color:#121628;opacity:1}

/* estrutura do personal */
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 112px}
.wrap{max-width:960px;margin:0 auto}
.side{display:none}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 4px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.logo-mark svg{width:19px;height:19px}
.logo-name{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:1.22rem;letter-spacing:-.01em}
@media(min-width:960px){
  .p-layout{display:grid;grid-template-columns:252px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;position:sticky;top:0;height:100vh}
  .side .logo{padding:0 10px 22px}
  .appbar,.p-nav{display:none!important}
  .main{padding-block:30px 64px;padding-left:44px;padding-right:max(44px,env(safe-area-inset-right,0px))}
}
.navi{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:11px;font-weight:650;color:var(--muted);text-align:left;width:100%}
.navi:hover{background:var(--surface-2);color:var(--ink)}
.navi[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
.navi .badge{margin-left:auto}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 10px 2px;border-top:1px solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%}
.side .me b{display:block;font-size:.92rem}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#FFFFFF;font-size:.72rem;font-weight:800;display:inline-grid;place-items:center}

/* abas inferiores */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav-in{max-width:540px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.bnav button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:9px 4px 11px;font-size:.74rem;font-weight:700;color:var(--muted);position:relative}
.bnav button .ic{width:23px;height:23px}
.bnav button[aria-current="page"]{color:var(--brand-text)}
.bnav .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;font-size:.66rem;padding:0 4px}

/* cabeçalho de página */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-block:12px 20px}
.ph .sub{color:var(--muted);margin-top:5px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--brand-text);font-weight:700;padding:8px 0;margin-top:6px}
.back .ic{width:18px;height:18px}

/* blocos */
.stack{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;min-height:64px;color:inherit;text-decoration:none}
.li:first-child{border-top:0}
button.li:hover,.li.hov:hover{background:var(--surface-2)}
.grow{flex:1;min-width:0}
.li .t{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:.84rem;color:var(--muted);display:block;margin-top:1px}
.li .quote{display:block;font-size:.86rem;color:var(--ink-2);margin-top:4px;font-style:italic}
.chev{color:var(--line-2);width:18px;height:18px}
.linkish{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.aic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.aic .ic{width:19px;height:19px}
.aic.bad{background:var(--bad-soft);color:var(--bad)}
.aic.warn{background:var(--warn-soft);color:var(--warn)}
.aic.brand{background:var(--brand-soft);color:var(--brand-text)}
.aic.ok{background:var(--ok-soft);color:var(--ok)}

/* números */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 13px;min-width:0}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:6px}
.kpi .l .ic{width:16px;height:16px}
.kpi .v{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.7rem;line-height:1.08;margin-top:7px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:.78rem;font-weight:650;margin-top:3px;color:var(--muted)}
.k3 .kpi .v{font-size:1.4rem}

/* rótulos */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.pill .ic{width:13px;height:13px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:0 18px;min-height:46px;font-weight:700;background:var(--brand);color:var(--brand-ink);text-decoration:none;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn .ic{width:18px;height:18px}
.btn.soft{background:var(--brand-soft);color:var(--brand-text)}
.btn.line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem;border-radius:10px}
.btn.lg{min-height:56px;font-size:1.06rem;border-radius:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* filtros e abas */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:650;font-size:.88rem;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .cnt{font-size:.75rem;color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .cnt{color:inherit;opacity:.7}
.chip.add{border-style:dashed;color:var(--brand-text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:11px 12px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab .ic{width:17px;height:17px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}

/* avatar */
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:.95rem;flex:none;background:var(--brand-soft);color:var(--brand-text)}
.ava.lg{width:66px;height:66px;font-size:1.45rem}
.ava.sm{width:34px;height:34px;font-size:.8rem}
.ava.h1{background:var(--h1bg);color:var(--h1fg)} .ava.h2{background:var(--h2bg);color:var(--h2fg)} .ava.h3{background:var(--h3bg);color:var(--h3fg)} .ava.h4{background:var(--h4bg);color:var(--h4fg)}
.me-btn{border:0;cursor:pointer}

/* formulários */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:440px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:650;color:var(--muted)}
.inp{width:100%;min-width:0;background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:1rem}
.inp:focus{border-color:var(--brand-text);outline:none;background:var(--surface)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.45}
select.inp{appearance:auto}
.searchbox{position:relative;display:block}
.searchbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
.searchbox .inp{padding-left:40px}
.check{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;accent-color:var(--brand);margin:1px 0 0}
.hint{font-size:.8rem;color:var(--muted)}

/* janela */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.sheet.anim{animation:up .22s ease-out}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 12px 12px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:1.15rem}
.sheet-b{overflow-y:auto;padding:16px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-f{padding:12px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@media(min-width:720px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:88vh}}
@keyframes up{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
.model{text-align:left;display:grid;gap:6px;width:100%;cursor:pointer;color:inherit}
.model:hover{border-color:var(--brand-text)}
.model-t{font-weight:750;font-size:1.02rem}
.model-f{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line);padding-top:14px}

/* painel */
.dash{display:flex;flex-direction:column;gap:22px}
@media(min-width:1120px){.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty .ic{width:28px;height:28px;color:var(--line-2)}
.empty b{color:var(--ink)}

/* perfil do aluno */
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;align-items:center}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--muted);margin-top:6px}
.prof-actions{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
@media(min-width:760px){.prof{grid-template-columns:auto minmax(0,1fr) auto}.prof-actions{grid-column:auto}}
@media(max-width:520px){.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.tab{justify-content:center;padding:11px 2px;font-size:.86rem}.tab .ic{display:none}}
.fhead .grow{flex:1 1 240px}
@media(max-width:480px){.g2.st{grid-template-columns:1fr}}
.tabc{padding-top:18px;display:flex;flex-direction:column;gap:16px}

/* ficha */
.fhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fname{font-family:var(--display);font-stretch:86%;font-weight:800;font-size:1.3rem;background:transparent;border:1.5px solid transparent;border-radius:10px;padding:4px 8px;margin-left:-9px;min-width:0;width:100%}
.fname:hover{border-color:var(--line)}
.fname:focus{border-color:var(--brand-text);outline:none;background:var(--surface-2)}
.exn{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-stretch:85%;font-weight:800;flex:none;font-size:.92rem;color:var(--ink-2)}
.ex-obs{display:flex;gap:5px;align-items:flex-start;font-size:.83rem;color:var(--ink-2);margin-top:4px}
.ex-obs .ic{width:15px;height:15px;margin-top:2px;color:var(--muted)}

/* evolução */
.metric-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.metric-big .v{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.metric-big .d{font-weight:700;font-size:.9rem}
.chart{width:100%;min-height:200px;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
.chart .line{stroke:var(--brand-text);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--brand-text);fill-opacity:.1;stroke:none}
.chart .pt{fill:var(--surface);stroke:var(--brand-text);stroke-width:2.5}
.chart .pt.last{fill:var(--brand-text)}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:12px;font-family:var(--body);font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.mini{grid-template-columns:repeat(4,minmax(0,1fr))}}
.freq{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:360px}
.freq .h{font-size:.68rem;font-weight:700;color:var(--muted);text-align:center}

function freqGrid(a){
 const t=new Date(),dow=(t.getDay()+6)%7,start=new Date(t);start.setDate(t.getDate()-dow-21);
 const set=new Set(a.hist.map(x=>x.data)),td=hoje();let h='',cnt=0;
 for(let i=0;i<28;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const on=set.has(k);if(on&&k<=td)cnt++;h+='<i class="'+(on?'on ':'')+(k===td?'today ':'')+(k>td?'fut':'')+'" title="'+dmy(k)+(on?' · treinou':'')+'"></i>'}
 return {h:'<div class="freq">'+'STQQSSD'.split('').map(x=>'<span class="h">'+x+'</span>').join('')+h+'</div>',cnt:cnt};
}
function evolucao(a,metric,who){

 const m=MET[metric],Lv=a.aval,last=Lv[Lv.length-1],fst=Lv[0],prev=Lv[Lv.length-2];
 const d=last[metric]-fst[metric],good=m.down?d<0:d>0;
 const dTxt=Lv.length>1&&Math.abs(d)>=.05?'<span class="d '+(good?'t-ok':'t-bad')+'">'+(d>0?'+':'−')+n1(Math.abs(d))+' '+m.du+' desde '+dmy(fst.data)+'</span>':'<span class="d muted">primeira avaliação em '+dmy(fst.data)+'</span>';

 const feitos=days.filter(d=>d.done).length,meta=+a.anam.dias||3;
 const h=new Date().getHours(),sal=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';

 if(!a.fichas.length||!a.fichas.some(f=>f.ex.length))return html+'<div class="card empty">'+ic('dumbbell')+'<b>Seu treino está sendo montado</b>'+esc(first(D.personal.nome))+' avisa quando estiver pronto.</div>';
 const ni=nextFicha(a),f=a.fichas[ni];
 html+='<section class="hero"><span class="eyebrow">Próximo treino</span><h2>Ficha '+L(ni)+' · '+esc(f.nome)+'</h2><p class="hero-meta num">'+f.ex.length+' exercícios · '+totalSeries(f)+' séries · cerca de '+durEst(f)+' min</p><button class="btn lg" data-a="start" data-v="'+ni+'">'+ic('play')+'Começar treino</button><span class="hero-l" aria-hidden="true">'+L(ni)+'</span></section>';

function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function drawCharts(){
 document.querySelectorAll('[data-chart]').forEach(el=>{
  const parts=el.dataset.chart.split('|'),a=al(parts[0]),met=parts[1];if(!a)return;
  const pts=a.aval.map(v=>({x:new Date(v.data+'T12:00').getTime(),y:+v[met],d:v.data})).filter(p=>!isNaN(p.y));if(!pts.length){el.innerHTML='';return}
  const W=Math.max(260,Math.round(el.clientWidth||320)),H=210,pl=44,pr=20,pt=26,pb=30;
  const ys=pts.map(p=>p.y);let lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  const span=Math.max(hi-lo,Math.abs(hi)*.02,.5);lo-=span*.35;hi+=span*.35;
  const step=nice((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x0=pts[0].x,x1=pts[pts.length-1].x,n=pts.length;
  const X=x=>n===1||x1===x0?pl+(W-pl-pr)/2:pl+(x-x0)/(x1-x0)*(W-pl-pr);
  const Y=y=>pt+(hi-y)/(hi-lo)*(H-pt-pb);
  const dec=step<1?1:0;let g='';
  for(let v=lo;v<=hi+step/2;v+=step){const y=Y(v).toFixed(1);g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="axis" x="'+(pl-8)+'" y="'+(+y+4)+'" text-anchor="end">'+v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+'</text>'}
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const area=n>1?'<path class="area" d="'+line+' L'+X(x1).toFixed(1)+','+(H-pb)+' L'+X(x0).toFixed(1)+','+(H-pb)+' Z"/>':'';
  let lx='',lastX=-999;
  const keep=pts.map((p,i)=>{const xx=X(p.x);if(i===n-1||xx-lastX>=46){lastX=xx;return true}return false});
  for(let i=n-1,rx=1e9;i>=0;i--){if(!keep[i])continue;const xx=X(pts[i].x);if(i!==n-1&&rx-xx<46){keep[i]=false;continue}rx=xx}
  pts.forEach((p,i)=>{if(!keep[i])return;const xx=Math.min(W-pr-14,Math.max(pl+14,X(p.x)));lx+='<text class="axis" x="'+xx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+dm(p.d)+'</text><text class="lbl" x="'+xx.toFixed(1)+'" y="'+(Y(p.y)-11).toFixed(1)+'" text-anchor="middle">'+n1(p.y)+'</text>'});
  const dots=pts.map((p,i)=>'<circle class="pt'+(i===n-1?' last':'')+'" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===n-1?5.5:4.5)+'"/>').join('');
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+g+area+(n>1?'<path class="line" d="'+line+'"/>':'')+dots+lx+'</svg>'+(n===1?'<p class="hint" style="text-align:center">Na próxima avaliação aparece a linha de evolução.</p>':'');
 });
}

function renderRest(){
 const r=$('#rest-ov');if(!r)return;if(!S.rest||!S.sess){r.hidden=true;r.innerHTML='';return}
 r.innerHTML='<div class="ro-in"><div class="ring"><svg viewBox="0 0 78 78" aria-hidden="true"><circle class="bgc" cx="39" cy="39" r="32" fill="none" stroke-width="6"/><circle class="fg" id="ring-fg" cx="39" cy="39" r="32" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="0"/></svg><b id="ring-t">0:00</b></div><b>Descanso</b><span>'+esc(S.rest.label)+'</span><div class="row"><button data-a="rest-add">+15 s</button><button data-a="rest-skip">Pular</button></div></div>';
 r.hidden=false;tickRest();
}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function tickRest(){
 if(!S.rest)return;const left=Math.ceil((S.rest.end-Date.now())/1000);
 if(left<=0){const adv=S.rest.adv;S.rest=null;beep();try{navigator.vibrate&&navigator.vibrate([220,120,220])}catch(e){}if(adv){advance();render();toast('Bora para o próximo exercício!')}else{renderRest();toast('Descanso acabou. Próxima série!')}return}
 const t=$('#ring-t'),fg=$('#ring-fg');if(t)t.textContent=mmss(left);if(fg)fg.setAttribute('stroke-dashoffset',(C*(1-left/S.rest.total)).toFixed(2));
}
function tickElapsed(){const el=$('#elapsed');if(el&&S.sess){const s=Math.floor((Date.now()-S.sess.start)/1000);el.textContent=s>=3600?Math.floor(s/3600)+':'+mmss(s%3600).padStart(5,'0'):mmss(s)}}
setInterval(()=>{tickRest();tickElapsed()},500);
document.addEventListener('visibilitychange',()=>{if(S.sess&&document.visibilityState==='visible')wake(true)});
function finishSess(){
 const s=S.sess,a=al(s.aid),f=a.fichas[s.fi];let series=0,vol=0;const cargas={};
 s.sets.forEach((sets,i)=>{const e=f.ex[i];const dn=sets.filter(x=>x.done);dn.forEach(x=>{series++;const c=numC(x.c);if(c!==null)vol+=c*repsN(x.r)});if(dn.length)cargas[e.n]=dn[dn.length-1].c});
 S.fim={aid:a.id,fi:s.fi,dur:Math.max(1,Math.round((Date.now()-s.start)/6e4)),series:series,vol:Math.round(vol),cargas:cargas,fb:null,nota:''};
 S.sess=null;stopRest();wake(false);
}
function endSess(){if(S.sess){S.sess=null;stopRest();wake(false)}}

/* ---------- utilidades ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.className='toast'+(S.rest?' high':'')+(S.role==='personal'?' pc':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},2600)}
function copy(txt){
 const fallback=()=>{const ta=$('#msg-text');if(ta){ta.focus();ta.select()}toast('Selecione o texto e copie')};
 try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado'),fallback)}catch(e){fallback()}
}
const top0=()=>{try{window.scrollTo(0,0)}catch(e){}};

/* ---------- desenho ---------- */
function render(){
 $('#demo').innerHTML='<div class="demo-in"><span class="demo-tag">'+ic('eye')+'<span>Demonstração<span class="wide"> com alunos fictícios</span></span></span><div class="switch" role="group" aria-label="Ver o app como"><button data-a="role" data-v="personal" aria-pressed="'+(S.role==='personal')+'">Personal</button><button data-a="role" data-v="aluno" aria-pressed="'+(S.role==='aluno')+'">Aluno</button></div></div>';
 $('#root').innerHTML=S.role==='personal'?renderPersonal():renderAluno();
 renderModal();renderRest();drawCharts();tickElapsed();
}

/* ---------- ações ---------- */
document.addEventListener('click',e=>{
 const w=$('#sheet-wrap');if(e.target===w){S.modal=null;render();return}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const A=b.dataset.a,v=b.dataset.v,pc=S.confirm;S.confirm=null;
 const a=S.role==='personal'?al(S.aid):al(S.a.aid);
 switch(A){
  case 'role':S.role=v;S.modal=null;if(v==='personal')endSess();top0();break;
  case 'nav':S.view=v;S.aid=null;S.modal=null;top0();break;
  case 'anav':S.a.view=v;top0();break;
  case 'open':S.view='aluno';S.aid=v;S.tab='treino';S.fi=0;S.modal=null;top0();break;
  case 'open-hist':S.view='aluno';S.aid=v;S.tab='evol';top0();break;
  case 'open-fin':S.view='aluno';S.aid=v;S.tab='fin';top0();break;
  case 'tab':S.tab=v;break;
  case 'filtro':S.filtro=v;break;
  case 'aluno-new':S.modal={t:'aluno',v:{nome:'',obj:'Saúde e qualidade de vida',modal:'Presencial · academia',valor:'200',venc:'10'}};break;
  case 'aluno-edit':{const x=al(v);S.modal={t:'aluno',id:v,v:{nome:x.nome,obj:x.obj,modal:x.modal,valor:String(x.valor).replace('.',','),venc:String(x.venc)}};break}
  case 'aluno-del':if(pc!=='aluno-del'){S.confirm='aluno-del';break}D.alunos=D.alunos.filter(x=>x.id!==S.modal.id);save();S.modal=null;S.view='alunos';S.aid=null;toast('Aluno removido');break;
  case 'ver-aluno':S.role='aluno';S.a.aid=v;S.a.view='inicio';S.fim=null;endSess();top0();break;
  case 'ficha':S.fi=+v;break;
  case 'ficha-add':a.fichas.push({nome:'Nova ficha',ex:[]});S.fi=a.fichas.length-1;save();toast('Ficha '+L(S.fi)+' criada');break;
  case 'ficha-del':if(pc!=='ficha-del'){S.confirm='ficha-del';break}a.fichas.splice(S.fi,1);a.hist.forEach(h=>{if(h.f>S.fi)h.f--});S.fi=Math.max(0,S.fi-1);save();toast('Ficha excluída');break;
  case 'modelos':S.modal={t:'modelos'};break;
  case 'modelo-apply':{const md=MODELOS.find(x=>x.id===v);a.fichas=md.fichas();S.fi=0;S.modal=null;save();toast('Modelo aplicado. Ajuste as cargas para '+first(a.nome));break}
  case 'ex-add':S.modal={t:'lib',g:'Todos',q:''};break;
  case 'lib-g':S.modal.g=v;break;
  case 'lib-pick':S.modal={t:'ex',mode:'new',v:exDefaults(v)};break;
  case 'ex-edit':{const x=a.fichas[S.fi].ex[+v];S.modal={t:'ex',mode:'edit',idx:+v,v:Object.assign({},x,{s:String(x.s),d:String(x.d),c:x.c==='—'?'':x.c})};break}
  case 'ex-move':{const ex=a.fichas[S.fi].ex,i=S.modal.idx,j=i+(+v);if(j<0||j>=ex.length)break;const t=ex[i];ex[i]=ex[j];ex[j]=t;S.modal.idx=j;save();toast(+v<0?'Exercício subiu':'Exercício desceu');break}
  case 'ex-del':if(pc!=='ex-del'){S.confirm='ex-del';break}a.fichas[S.fi].ex.splice(S.modal.idx,1);S.modal=null;save();toast('Exercício removido');break;
  case 'close':S.modal=null;break;
  case 'aval-new':S.modal={t:'aval',v:{data:hoje(),peso:'',gord:'',musc:'',cint:''}};break;
  case 'avaliar':S.view='aluno';S.aid=v;S.tab='evol';S.modal={t:'aval',v:{data:hoje(),peso:'',gord:'',musc:'',cint:''}};top0();break;
  case 'anam':S.view='aluno';S.aid=v;S.tab='anam';top0();break;
  case 'metric':if(S.role==='personal')S.metric=v;else S.a.metric=v;break;
  case 'parq':a.anam.parq[+b.dataset.i]=v==='1';save();break;
  case 'pagar':{const x=al(v),k=monthKey();if(x.pag[k]){delete x.pag[k];toast('Pagamento desfeito')}else{x.pag[k]=hoje();toast('Pagamento de '+first(x.nome)+' registrado')}save();break}
  case 'cobrar':{const x=al(v);S.modal={t:'msg',title:'Cobrar '+first(x.nome),text:msgCobranca(x)};break}
  case 'chamar':{const x=al(v);S.modal={t:'msg',title:'Mensagem para '+first(x.nome),text:msgIncentivo(x)};break}
  case 'cor':D.personal.cor=v;applyBrand();save();break;
  case 'reset':if(pc!=='reset'){S.confirm='reset';break}D=seed();save();applyBrand();S.view='inicio';S.aid=null;S.a.aid=D.alunos[0].id;S.fim=null;endSess();toast('Dados de exemplo restaurados');break;
  case 'copy':copy(v);return;
  case 'copy-msg':copy(($('#msg-text')||{}).value||'');return;
  case 'start':if(startSess(+v))top0();break;
  case 'set':toggleSet(+b.dataset.i,+b.dataset.j);break;
  case 'sess-exit':if(pc!=='sess-exit'){S.confirm='sess-exit';break}endSess();top0();break;
  case 'finish':{const s=S.sess,left=s.sets.reduce((t,x)=>t+x.filter(y=>!y.done).length,0),total=s.sets.reduce((t,x)=>t+x.length,0);if(left===total){toast('Marque pelo menos uma série antes de finalizar');break}if(left>0&&pc!=='finish'){S.confirm='finish';break}finishSess();top0();break}
  case 'fb':S.fim.fb=v;break;
  case 'fim-send':{const r=S.fim;if(!r.fb){toast('Escolha como foi o treino');break}const x=al(r.aid);x.hist.push({id:uid(),data:hoje(),f:r.fi,fb:r.fb,nota:r.nota.trim(),dur:r.dur,series:r.series,vol:r.vol,cargas:r.cargas});save();S.fim=null;S.a.view='inicio';toast('Enviado para '+first(D.personal.nome));top0();break}
  case 'rest-add':if(S.rest){S.rest.end+=15000;S.rest.total+=15;tickRest()}return;
  case 'rest-skip':{const adv=S.rest&&S.rest.adv;stopRest();if(!adv)return;advance();break}
  case 'ex-next':stopRest();advance();break;
  case 'ex-prev':stopRest();S.sess.cur=Math.max(0,S.sess.cur-1);top0();break;
  default:return;
 }
 render();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.mk&&S.modal){S.modal.v[t.dataset.mk]=t.value;return}
 if(t.id==='busca'){S.busca=t.value;const l=$('#alunos-list');if(l)l.innerHTML=alunosRows();return}
 if(t.id==='lib-q'&&S.modal){S.modal.q=t.value;$('#lib-list').innerHTML=libRows();return}
 if(t.dataset.ss&&S.sess){S.sess.sets[+t.dataset.i][+t.dataset.j][t.dataset.ss]=t.value;return}
 if(t.id==='msg-text'&&S.modal){S.modal.text=t.value;const l=$('#msg-wa');if(l)l.href=wa(t.value);return}
 if(t.id==='fim-nota'&&S.fim){S.fim.nota=t.value;return}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='demo-aluno'){S.a.aid=t.value;S.a.view='inicio';S.fim=null;endSess();render();return}
 const a=al(S.aid);
 if(t.dataset.f==='ficha-nome'&&a){a.fichas[S.fi].nome=t.value.trim()||'Ficha '+L(S.fi);save();toast('Nome da ficha salvo');return}
 if(t.dataset.f==='an'&&a){a.anam[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;save();if(t.type==='checkbox')render();else toast('Anamnese salva');return}
 if(t.dataset.f==='al'&&a){a[t.dataset.k]=t.value;save();toast('Anamnese salva');return}
 if(t.dataset.f==='aj'){D.personal[t.dataset.k]=t.value.trim();save();toast('Perfil salvo');return}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.id,m=S.modal;if(!m)return;
 if(id==='f-ex'){const v=m.v,a=al(S.aid);const ex={id:v.id||uid(),n:v.n,g:v.g,s:Math.max(1,Math.min(20,parseInt(v.s)||1)),r:String(v.r||'').trim()||'12',c:String(v.c||'').trim()||'—',d:Math.max(0,parseInt(v.d)||0),obs:String(v.obs||'').trim(),vid:String(v.vid||'').trim()};
  const list=a.fichas[S.fi].ex;if(m.mode==='edit')list[m.idx]=ex;else list.push(ex);save();S.modal=null;toast(m.mode==='edit'?'Exercício salvo':ex.n+' adicionado');}
 if(id==='f-aval'){const v=m.v,a=al(S.aid);const r={data:v.data||hoje(),peso:pf(v.peso),gord:pf(v.gord),musc:pf(v.musc),cint:pf(v.cint)};
  if([r.peso,r.gord,r.musc,r.cint].some(x=>isNaN(x)||x<=0)){toast('Preencha peso, gordura, massa muscular e cintura');return}
  a.aval.push(r);a.aval.sort((x,y)=>x.data.localeCompare(y.data));save();S.modal=null;toast('Avaliação registrada');}
 if(id==='f-aluno'){const v=m.v;const nome=String(v.nome||'').trim();if(!nome){toast('Digite o nome do aluno');return}
  const venc=Math.max(1,Math.min(28,parseInt(v.venc)||10)),valor=Math.max(0,pf(v.valor)||0);
  if(m.id){Object.assign(al(m.id),{nome:nome,obj:v.obj,modal:v.modal,valor:valor,venc:venc});save();S.modal=null;toast('Dados salvos')}
  else{const x={id:'a'+uid(),nome:nome,obj:v.obj,modal:v.modal,valor:valor,venc:venc,inicio:hoje(),pag:{},fichas:[],aval:[],hist:[],anam:{dias:'3',parq:[null,null,null,null,null,null,null],lib:false,les:'',med:'',obs:'',lgpd:false}};
   D.alunos.push(x);save();S.modal=null;S.view='aluno';S.aid=x.id;S.tab='treino';S.fi=0;toast(first(nome)+' cadastrado');top0()}}
 render();
});
let tx=null;
document.addEventListener('touchstart',e=>{const t=e.target;tx=(S.sess&&t.closest&&t.closest('#sess-main')&&!t.closest('button'))?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!tx||!S.sess)return;const t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y;tx=null;if(Math.abs(dx)<70||Math.abs(dy)>60)return;const n=curF().ex.length;const c=S.sess.cur+(dx<0?1:-1);if(c<0||c>=n)return;stopRest();S.sess.cur=c;render()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

applyBrand();render();
})();
</script>

</body>
